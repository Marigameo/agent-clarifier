<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>agent-clarifier · playground</title>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body>
    <main class="stage">
      <div class="chat" id="chat">
        <div class="msgs" id="msgs"></div>
        <div class="dock" id="dock">
          <agent-clarifier id="clarifier" composer="#composer-input"></agent-clarifier>
          <form class="composer" id="composer">
            <textarea id="composer-input" rows="1" placeholder="Message the agent…" aria-label="Message"></textarea>
            <button class="send" type="submit" aria-label="Send">↑</button>
          </form>
        </div>
      </div>
    </main>

    <aside class="panel">
      <header>
        <h1>agent-clarifier</h1>
        <p>Playground · the real component, dummy data. Every setting is in the URL. <a href="./chat.html">See it in a chat app →</a></p>
      </header>

      <section>
        <h2>Scenario</h2>
        <div class="scenarios" id="scenarios"></div>
        <p class="note" id="note"></p>
        <button class="restart" id="restart" type="button">↺ Restart scenario</button>
      </section>

      <section class="controls" id="controls"></section>

      <section>
        <h2>State</h2>
        <pre class="state" id="state"></pre>
      </section>

      <section>
        <h2>Events <button class="clear" id="clear" type="button">clear</button></h2>
        <ol class="log" id="log" reversed></ol>
      </section>

      <section>
        <h2>Last result (what the agent gets)</h2>
        <pre class="result" id="result">—</pre>
      </section>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
